<div
  [class.form-switch]="checkType() === 'toggle'"
  [class.label-bottom]="labelPosition() === 'bottom'"
  [class.label-left]="labelPosition() === 'left'"
  [class.label-right]="labelPosition() === 'right'"
  [class.label-top]="labelPosition() === 'top'"
  [class.toggle-wrapper]="checkType() === 'toggle'"
  [ngClass]="{ 'mb-3': !removeMargin(), 'form-check': !removeMargin() }"
>
  @if (componentLabel()) {
    <label
      [htmlFor]="componentId()"
      class="form-label d-flex gap-2"
    >
      <div>
        <span>{{ componentLabel() | transloco }}</span>
        <span [hidden]="!_isRequired()">*</span>
      </div>
      @if (helpMessage() && helpMessageTooltip()) {
        <div
          [class.pointer]="showTooltipMethod() === 'click'"
          [overlayPosition]="tooltipPosition()"
          [quangTooltip]="helpMessage() | transloco"
          [showMethod]="showTooltipMethod()"
        >
          <ng-content select="[help-icon]" />
        </div>
      }
    </label>
  }
  <input
    [attr.required]="getIsRequiredControl()"
    [attr.role]="checkType() === 'checkbox' ? 'checkbox' : 'switch'"
    [checked]="_value()"
    [class.is-invalid]="_showErrors()"
    [class.is-valid]="_showSuccess()"
    [disabled]="_isDisabled()"
    [id]="componentId()"
    [ngClass]="componentClass()"
    [placeholder]="componentPlaceholder() | transloco"
    [readOnly]="isReadonly()"
    [tabIndex]="componentTabIndex()"
    [value]="_value()"
    (blur)="onBlurHandler()"
    (input)="onChangedEventHandler($event)"
    class="form-check-input {{ _isDisabled() ? '' : 'cursor-pointer' }}"
    type="checkbox"
  />
  <div class="valid-feedback">
    {{ successMessage() | transloco }}
  </div>
  <div class="invalid-feedback">
    {{ _currentErrorMessage() | transloco: _currentErrorMessageExtraData() }}
  </div>
  @if (helpMessage() && !helpMessageTooltip()) {
    <small
      [hidden]="_showSuccess() || _showErrors()"
      aria-live="assertive"
      class="form-text text-muted"
    >
      {{ helpMessage() | transloco }}
    </small>
  }
</div>
