<div class="playground-showcase form-showcase">
  <div class="showcase-header">
    <h2>{{ 'menu.form' | transloco }} / {{ 'menu.formExample' | transloco }}</h2>
  </div>

  <playground-example-viewer
    [description]="'form.showcase.liveExample.description' | transloco"

  </playground-example-viewer>
</div>
