<h3>{{ 'quang.overlay.modal.service' | transloco }}</h3>

<div class="alert alert-info mb-3">
  <strong>Multiple Modal Support:</strong> You can open multiple modals simultaneously. Test opening modals from inside
  other modals!
</div>

<div class="row g-3 mb-3">
  <div class="col-auto">
    <button
      (click)="openServiceModal('center')"
      class="btn btn-primary"
    >
      Open Center Modal
    </button>
  </div>
  <div class="col-auto">
    <button
      (click)="openServiceModal('left')"
      class="btn btn-primary"
    >
      Open Left Modal
    </button>
  </div>
  <div class="col-auto">
    <button
      (click)="openServiceModal('right')"
      class="btn btn-primary"
    >
      Open Right Modal
    </button>
  </div>
</div>

@if (hasOpenModals()) {
  <div class="alert alert-success">
    <strong>Open Modals ({{ modalCount() }}):</strong>
    <div class="mt-2">
      @for (id of openModalIds(); track id) {
        <div class="btn btn-sm btn-outline-secondary me-2 mb-1">{{ id }}</div>
      }
    </div>
  </div>
}

<div class="mt-5 border-top pt-4">
  <playground-component-documentation
    [componentType]="ModalServiceTestPageComponent"
    [customReadmePath]="componentsReadmePath()"
  />
</div>
