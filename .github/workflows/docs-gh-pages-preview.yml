name: Deploy Docs Preview (pre-release tags)

on:
  push:
    tags:
      # Supports tags like 20.6.1-0, 20.6.1-beta.2, v20.6.1-0, v20.6.1-beta.2
      - '*.*.*-*'
      - 'v*.*.*-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with docs-gh-pages so both serialize on the gh-pages branch.
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish
        uses: ./.github/actions/deploy-docs
        with:
          base-href: /quix-quang/preview/
          target: preview
          commit-message: "docs(preview): ${{ github.ref_name }}"
