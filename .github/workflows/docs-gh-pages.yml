name: Deploy Docs (gh-pages)

on:
  push:
    branches:
      - quang20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare docs content
        run: npm run copy-readme

      - name: Build playground
        run: npx ng build playground --configuration production --base-href=/quix-quang/

      - name: Checkout gh-pages (worktree)
        run: |
          set -euxo pipefail
          git fetch origin gh-pages
          git worktree add -B gh-pages gh-pages-worktree origin/gh-pages

      - name: Publish to gh-pages root (preserve previews)
        run: |
          set -euxo pipefail
          rsync -a --delete --exclude 'previews' dist/playground/browser/ gh-pages-worktree/

      - name: Commit and push
        run: |
          set -euxo pipefail
          cd gh-pages-worktree

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "docs: deploy from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
