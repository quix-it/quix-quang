name: Deploy Docs (gh-pages)

on:
  push:
    branches:
      - quang20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with docs-gh-pages-preview so both serialize on the gh-pages branch.
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish
        uses: ./.github/actions/deploy-docs
        with:
          base-href: /quix-quang/
          target: root
          commit-message: "docs: deploy from ${{ github.sha }}"
