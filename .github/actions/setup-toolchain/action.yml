name: Setup toolchain
description: Node and pnpm at the versions pinned in mise.toml, then pnpm install --frozen-lockfile.

runs:
  using: composite
  steps:
    # mise.toml is the single source of the toolchain: Node major and exact pnpm come from it.
    - name: Read toolchain from mise.toml
      id: toolchain
      shell: bash
      run: |
        echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(sed -n 's/^pnpm = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.toolchain.outputs.node }}

    - name: Install
      shell: bash
      run: |
        npm i -g "pnpm@${{ steps.toolchain.outputs.pnpm }}"
        pnpm install --frozen-lockfile
